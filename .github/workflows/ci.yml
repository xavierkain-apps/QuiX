name: CI

permissions:
  contents: read

# Un exécuteur macOS compte dix fois son temps réel dans le quota Actions : un push sur QuiX pèse
# onze minutes, dont dix pour la seule minute de compilation du bundle. Le plan Free de
# l'organisation en donne deux mille par mois, partagées avec les autres apps — d'où les deux
# économies ci-dessous, qui ne coûtent aucune couverture.

on:
  push:
    branches: [main, "feat/**"]
    # Un commit qui ne touche que de la documentation n'a rien à compiler.
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  workflow_dispatch:

# Pousser trois fois de suite abandonne les deux premières compilations au lieu de les payer.
# Seule la dernière compte, et c'est la seule dont le résultat nous intéresse.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core — moteur pur (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5

      - name: Tests du moteur
        run: swift test --package-path Core

      # Le moteur se pilote en ligne de commande avant d'avoir la moindre fenêtre. On le prouve
      # ici sur les deux `moov` réels de la HERO12 : un clip tagué, un clip sans tag. C'est le
      # garde-fou contre la régression qui coûterait le produit — voir docs/HILIGHT.md.
      - name: Lecture des tags sur les échantillons réels
        run: |
          swift build --package-path Core --product quix
          QUIX="$(swift build --package-path Core --product quix --show-bin-path)/quix"
          FIXTURES=Core/Tests/QuiXCoreTests/Fixtures

          TAGGED="$("$QUIX" hilight "$FIXTURES/hero12-un-highlight.mp4")"
          PLAIN="$("$QUIX" hilight "$FIXTURES/hero12-sans-highlight.mp4")"
          echo "$TAGGED"
          echo "$PLAIN"

          echo "$TAGGED" | grep -q "1 moment(s)" \
            || { echo "::error::le clip tagué devrait porter exactement 1 moment"; exit 1; }
          echo "$TAGGED" | grep -q "3.436 s" \
            || { echo "::error::le moment de la HERO12 est à 3436 ms"; exit 1; }
          echo "$PLAIN" | grep -q "0 moment(s)" \
            || { echo "::error::le clip sans highlight ne doit porter aucun moment"; exit 1; }

  app:
    name: App — bundle macOS
    runs-on: macos-latest
    permissions:
      # Le seul droit d'écriture du dépôt, et uniquement pour publier la release sur un tag.
      contents: write
    env:
      # Signature Developer ID + notarisation dès que les secrets existent, signature ad hoc
      # sinon. Le même dépôt produit donc un bundle dans les deux cas — voir SIGNING.md.
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Version d'Xcode
        run: xcodebuild -version

      - name: Contrôler le certificat avant de l'importer
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # `security import` ne sait dire qu'une chose quand ça se passe mal :
          # « Unknown format in import ». Ça ne distingue pas un secret qui n'est pas du base64,
          # d'un certificat .cer sans clé privée, d'un PEM, ou d'un mot de passe qui ne correspond
          # pas — quatre erreurs qui se corrigent de quatre façons différentes. Ce contrôle les
          # sépare. Il n'affiche jamais que la taille et les deux premiers octets : rien de la clé.
          RAW="$RUNNER_TEMP/cert.p12"
          # Les espaces et retours à la ligne ne font pas partie de l'encodage : `base64 -i` en
          # insère tous les 76 caractères, et un copier-coller peut en ajouter d'autres.
          CLEAN=$(printf '%s' "$MACOS_CERT_P12" | tr -d '[:space:]')

          # Deux encodages sont acceptés, parce que les deux se fabriquent en une commande sur un
          # Mac et qu'ils portent exactement les mêmes octets : `base64 -i cert.p12` et
          # `xxd -p cert.p12`. Ils se distinguent sans ambiguïté — un .p12 commence par les octets
          # 30 82, ce qui donne « MII… » en base64 et « 3082… » en hexadécimal.
          if printf '%s' "$CLEAN" | head -c 4 | grep -qiE '^3082$'; then
            echo "MACOS_CERT_P12 fourni en hexadécimal."
            printf '%s' "$CLEAN" | xxd -r -p > "$RAW"
          elif printf '%s' "$CLEAN" | base64 --decode > "$RAW" 2>/dev/null; then
            echo "MACOS_CERT_P12 fourni en base64."
          else
            echo "::error::MACOS_CERT_P12 n'est ni du base64 ni de l'hexadécimal. Refaire : base64 -i certificat.p12 | pbcopy"
            exit 1
          fi

          SIZE=$(stat -f%z "$RAW" 2>/dev/null || echo 0)
          echo "Décodé : $SIZE octets, débute par $(head -c 2 "$RAW" | xxd -p)"

          if [ "$SIZE" -lt 500 ]; then
            echo "::error::Le fichier décodé fait $SIZE octets — bien trop peu pour un .p12 (quelques kilo-octets). Le secret est probablement tronqué ou vide."
            exit 1
          fi

          if head -c 11 "$RAW" | grep -q -- "-----BEGIN"; then
            echo "::error::C'est un fichier PEM (texte), pas un .p12. Réexporter depuis Trousseau d'accès au format « Échange d'informations personnelles (.p12) »."
            exit 1
          fi

          # OpenSSL 3 refuse par défaut le chiffrement hérité qu'utilise le Trousseau d'accès,
          # d'où la seconde tentative avec -legacy. `security` accepte les deux.
          if openssl pkcs12 -in "$RAW" -passin "pass:$MACOS_CERT_PASSWORD" -nokeys -noout 2>/dev/null \
             || openssl pkcs12 -legacy -in "$RAW" -passin "pass:$MACOS_CERT_PASSWORD" -nokeys -noout 2>/dev/null; then
            echo "PKCS#12 valide, et MACOS_CERT_PASSWORD correspond."
          elif openssl x509 -inform DER -in "$RAW" -noout 2>/dev/null; then
            echo "::error::C'est un certificat seul (.cer), sans la clé privée. Dans Trousseau d'accès, dérouler le certificat et exporter l'ensemble « certificat + clé » au format .p12 — pas le .cer téléchargé depuis le portail Apple."
            exit 1
          elif openssl pkcs12 -in "$RAW" -passin "pass:" -nokeys -noout 2>/dev/null \
             || openssl pkcs12 -legacy -in "$RAW" -passin "pass:" -nokeys -noout 2>/dev/null; then
            echo "::error::Le .p12 s'ouvre sans mot de passe, mais MACOS_CERT_PASSWORD en contient un. Vider le secret, ou réexporter le certificat en choisissant un mot de passe."
            exit 1
          elif openssl pkcs12 -in "$RAW" -passin "pass:$MACOS_CERT_PASSWORD" -nokeys -noout 2>&1 | grep -qiE "mac verify|invalid password|wrong password"; then
            # Verdict consultatif : `security import` est le seul juge qui compte, et il accepte
            # des chiffrements hérités qu'OpenSSL 3 refuse. On avertit et on le laisse trancher
            # plutôt que de bloquer un certificat qui aurait peut-être marché.
            echo "::warning::OpenSSL n'ouvre pas ce .p12 avec MACOS_CERT_PASSWORD. Si l'import échoue juste après, c'est que le mot de passe n'est pas celui choisi à l'export du certificat."
          else
            echo "::error::Format non reconnu. Un .p12 commence toujours par les octets 30 82."
            echo "Seize premiers octets : $(head -c 16 "$RAW" | xxd -p)"

            # Un base64 amputé ou préfixé d'un caractère décale tout le flux de six bits : la
            # taille reste plausible, le contenu est illisible. Si un décalage rétablit l'en-tête,
            # c'est que le secret a été abîmé au copier-coller, pas mal fabriqué.
            for SKIP in 1 2 3; do
              if printf '%s' "${CLEAN:$SKIP}" | base64 --decode 2>/dev/null | head -c 2 | xxd -p | grep -q "^3082"; then
                echo "::error::Le secret porte $SKIP caractère(s) parasite(s) en tête — le reste est un .p12 valide. Recopier la sortie de « base64 -i certificat.p12 » sans rien devant."
                exit 1
              fi
            done
            OFFSET=$(xxd -p "$RAW" | tr -d '\n' | head -c 512 | grep -bo "3082" | head -1 | cut -d: -f1)
            if [ -n "$OFFSET" ]; then
              echo "Un en-tête 30 82 apparaît à l'octet $((OFFSET / 2)) : le fichier est probablement préfixé."
            fi
            echo "Diagnostic OpenSSL :"
            openssl pkcs12 -in "$RAW" -passin "pass:$MACOS_CERT_PASSWORD" -nokeys -noout 2>&1 | head -3
            exit 1
          fi

          echo "Certificat validé, laissé dans \$RUNNER_TEMP pour l'étape suivante."

      - name: Importer le certificat Developer ID
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Un mot de passe collé depuis un gestionnaire emporte souvent une espace ou un retour
          # à la ligne. On tente tel quel — un mot de passe a le droit de finir par une espace —
          # puis rogné, en le disant.
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
               -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign 2>/dev/null; then
            TRIMMED=$(printf '%s' "$MACOS_CERT_PASSWORD" | tr -d '[:space:]')
            if [ "$TRIMMED" != "$MACOS_CERT_PASSWORD" ] && security import "$RUNNER_TEMP/cert.p12" \
                 -k "$KEYCHAIN" -P "$TRIMMED" -T /usr/bin/codesign 2>/dev/null; then
              echo "::warning::MACOS_CERT_PASSWORD contenait des espaces ou un retour à la ligne parasites. À nettoyer dans le secret."
            else
              echo "::error::MACOS_CERT_PASSWORD n'ouvre pas le certificat. C'est le mot de passe choisi au moment de l'export .p12 depuis Trousseau d'accès — ni le mot de passe de session, ni l'Apple ID, ni le mot de passe d'application."
              security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
                -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
              exit 1
            fi
          fi
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed 's/^.*"\(.*\)"$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Aucune identité « Developer ID Application » dans le certificat"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Compiler l'application
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_SIGNING" = "true" ] && [ -n "$CODESIGN_IDENTITY" ]; then
            SIGN_ARGS=(
              CODE_SIGN_STYLE=Manual
              "CODE_SIGN_IDENTITY=$CODESIGN_IDENTITY"
              "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
              "OTHER_CODE_SIGN_FLAGS=--timestamp"
            )
          else
            # Signature ad hoc : le bundle se lance, mais Gatekeeper avertit au premier
            # démarrage. C'est la seule signature possible sans le certificat de Xavier.
            SIGN_ARGS=(CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi

          xcodebuild build \
            -project QuiX.xcodeproj \
            -scheme QuiX \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            "${SIGN_ARGS[@]}"

          echo "APP=build/Build/Products/Release/QuiX.app" >> "$GITHUB_ENV"

      - name: Notariser
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"

      - name: Vérifier le bundle
        run: |
          test -x "$APP/Contents/MacOS/QuiX"

          # L'app ne voit aucun fichier sur la carte si macOS ne lui a pas demandé l'accès aux
          # volumes amovibles, et il ne le demande que si cette clé est dans l'Info.plist. Le
          # symptôme, sinon, ressemble exactement à une carte vide : à vérifier ici, pas à la main.
          plutil -extract NSRemovableVolumesUsageDescription raw \
            "$APP/Contents/Info.plist" > /dev/null \
            || { echo "::error::NSRemovableVolumesUsageDescription absent de l'Info.plist"; exit 1; }

          # Universelle : Xavier peut être sur Apple Silicon comme sur Intel.
          lipo -info "$APP/Contents/MacOS/QuiX"
          lipo -archs "$APP/Contents/MacOS/QuiX" | grep -q arm64 \
            || { echo "::error::bundle non universel, arm64 manquant"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/QuiX" | grep -q x86_64 \
            || { echo "::error::bundle non universel, x86_64 manquant"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP"

          if [ -n "$CODESIGN_IDENTITY" ]; then
            codesign --display --verbose=4 "$APP" 2>&1 | grep -q "flags=.*runtime" \
              || { echo "::error::runtime durci absent, la notarisation ne tiendra pas"; exit 1; }
            spctl --assess --type execute --verbose "$APP"
          fi

      - name: Compresser l'app
        run: ditto -c -k --keepParent "$APP" QuiX.zip

      - name: Publier l'artefact
        uses: actions/upload-artifact@v5
        with:
          name: QuiX
          path: QuiX.zip
          if-no-files-found: error

      - name: Publier la release (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" QuiX.zip \
            --title "QuiX $GITHUB_REF_NAME" \
            --generate-notes
