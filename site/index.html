<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuiX — free GoPro importer for Mac that sorts your highlights</title>
<meta name="description" content="Press the button on your GoPro when something good happens. QuiX finds those moments and puts the clips in their own folder, automatically. Free, for Mac.">
<link rel="icon" href="assets/favicon.png">
<meta property="og:title" content="QuiX — your GoPro highlights, sorted the moment you plug in">
<meta property="og:description" content="Press the button while you film. QuiX does the rest. Free, for Mac.">
<meta property="og:image" content="https://quix.xavier-kain.fr/assets/icon-1024.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="./"><img src="assets/icon-256.png" alt="QuiX"><span>QuiX</span></a>
    <div class="head-right">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
      <a class="btn small" href="#download" data-t="navGet">Free download</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="halo" aria-hidden="true"></div>
  <div class="wrap" style="position: relative">
    <img class="icon" src="assets/icon-1024.png" alt="QuiX" width="132" height="132">
    <h1 data-reveal data-t="h1">Plug in. Your best moments are already sorted.</h1>
    <p class="lede" data-reveal data-t="sub"></p>
    <div class="ctas" data-reveal>
      <a class="btn" href="#download" data-t="ctaPrimary">Download for free</a>
    </div>
    <p class="hero-foot mono" data-t="heroFoot"></p>
  </div>
</section>

<!-- What happens after you plug in, animated: transfer, library, Finder, the clip playing.
     Already full width, so it is not zoomable: enlarging it would not show it any bigger. -->
<section class="wrap shot-section" data-reveal>
  <figure class="shot glow" id="fig-transfer">
    <svg class="orbit" aria-hidden="true"><rect class="c5" pathLength="100" x="1" y="1" rx="18" width="100%" height="100%"/><rect class="c4" pathLength="100" x="1" y="1" rx="18" width="100%" height="100%"/><rect class="c3" pathLength="100" x="1" y="1" rx="18" width="100%" height="100%"/><rect class="c2" pathLength="100" x="1" y="1" rx="18" width="100%" height="100%"/><rect class="c1" pathLength="100" x="1" y="1" rx="18" width="100%" height="100%"/></svg>
    <div class="mock-frame" id="mock-transfer"></div>
  </figure>
  <figcaption class="mono note caption" data-t="shotHero"></figcaption>
</section>

<section class="wrap">
  <div class="kicker mono" data-reveal data-t="howKicker"></div>
  <h2 data-reveal data-t="howTitle" class="h2-narrow"></h2>
  <div class="how" id="howSteps"></div>
</section>

<!-- The gesture everything else relies on. Without it, the app has nothing to sort. -->
<section class="wrap">
  <div class="two middle">
    <div>
      <div class="kicker mono" data-reveal data-t="hlKicker"></div>
      <h2 data-reveal data-t="hlTitle" style="max-width: 16ch"></h2>
      <p class="body-lg" data-reveal data-t="hlBody"></p>
      <p class="body-sm" data-reveal data-t="hlNote"></p>
    </div>
    <div data-reveal id="gopro"></div>
  </div>
</section>

<section class="wrap">
  <div class="traits" id="traits"></div>
</section>

<section class="wrap">
  <div class="onb-head">
    <div>
      <div class="kicker mono" data-reveal data-t="onbKicker"></div>
      <h2 data-reveal data-t="onbTitle" style="max-width: 20ch; margin-bottom: 0"></h2>
    </div>
    <span class="hint mono" data-t="onbHint"></span>
  </div>
  <div class="onb" id="onb"></div>
</section>

<section class="wrap">
  <div class="two middle">
    <div>
      <h2 data-reveal data-t="libTitle" style="max-width: 16ch"></h2>
      <p class="body-lg" data-reveal data-t="libBody" style="margin-bottom: 0"></p>
    </div>
    <div data-reveal>
      <figure class="shot pop-shot" id="fig-popover">
        <div class="mock-frame small" id="mock-popover"></div>
      </figure>
      <figcaption class="mono note caption" data-t="shotPopover"></figcaption>
    </div>
  </div>
</section>

<section class="wrap" id="download">
  <div class="download-box" data-reveal>
    <img src="assets/icon-256.png" alt="" width="62" height="62">
    <h2 data-t="dlTitle"></h2>
    <p data-t="dlBody"></p>

    <form class="gate" method="post" action="telechargement.php" id="gate">
      <div>
        <label for="prenom" data-t="dlFirstName">First name</label>
        <input id="prenom" name="prenom" type="text" autocomplete="given-name" required maxlength="80">
      </div>
      <div>
        <label for="email" data-t="dlEmail">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="160">
      </div>
      <div style="position: absolute; left: -9999px" aria-hidden="true">
        <input type="text" name="site" tabindex="-1" autocomplete="off">
      </div>
      <label class="consent">
        <input type="checkbox" name="nouvelles" value="1" checked>
        <span data-t="dlConsent"></span>
      </label>
      <button class="btn" type="submit" data-t="dlSubmit">Send me the free download</button>
      <p class="note" data-t="dlPrivacy"></p>
    </form>

    <p class="download-foot mono" data-t="dlFoot"></p>
  </div>
</section>

<footer>
  <span class="mono">QuiX — <span data-t="footerTag"></span></span>
</footer>

<script src="assets/copy.js"></script>
<script src="assets/mockups.js"></script>
<script src="assets/demo.js"></script>
<script src="assets/page.js"></script>
</body>
</html>
